# Base service definition shared by dev and prod.
#   Dev:  docker compose up                (also loads compose.override.yaml)
#   Prod: docker compose -f compose.yaml -f compose.prod.yaml up -d --build
services:
  xsheet:
    image: ${MLW_IMAGE:-mlw-xsheet}:${MLW_TAG:-latest}
    build:
      context: .
      target: prod
    ports:
      - "${MLW_HOST_PORT:-8080}:8080"
    environment:
      # The server's time zone, for timestamps such as the pop-up log's: the
      # host's own (its /etc/localtime, mounted below), unless TZ is set in
      # .env (e.g. TZ=America/Denver). It's passed as MLW_TZ rather than TZ,
      # since an empty TZ would silently mean UTC.
      MLW_TZ: ${TZ:-}
      # Login against Keycloak (realm mlw); see auth.py. With MLW_KEYCLOAK_URL
      # empty, or Keycloak unreachable, only the built-in admin account works.
      MLW_KEYCLOAK_URL: ${MLW_KEYCLOAK_URL:-}
      MLW_KEYCLOAK_REALM: ${MLW_KEYCLOAK_REALM:-mlw}
      MLW_KEYCLOAK_CLIENT_ID: ${MLW_KEYCLOAK_CLIENT_ID:-mlw-xsheet}
      MLW_KEYCLOAK_CLIENT_SECRET: ${MLW_KEYCLOAK_CLIENT_SECRET:-}
      MLW_KEYCLOAK_ADMIN_ROLE: ${MLW_KEYCLOAK_ADMIN_ROLE:-admin}
      MLW_KEYCLOAK_VIEWER_ROLE: ${MLW_KEYCLOAK_VIEWER_ROLE:-XSheet Viewer}
      MLW_KEYCLOAK_REVIEWER_ROLE: ${MLW_KEYCLOAK_REVIEWER_ROLE:-XSheet Reviewer}
      MLW_KEYCLOAK_EDITOR_ROLE: ${MLW_KEYCLOAK_EDITOR_ROLE:-XSheet Editor}
      MLW_KEYCLOAK_ADMIN_CLIENT_ID: ${MLW_KEYCLOAK_ADMIN_CLIENT_ID:-mlw-xsheet-admin}
      MLW_KEYCLOAK_ADMIN_CLIENT_SECRET: ${MLW_KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      MLW_KEYCLOAK_VERIFY_TLS: ${MLW_KEYCLOAK_VERIFY_TLS:-1}
      # The user's own file storage, on an mlw-storage server (SFTPGo behind a gateway): see
      # storage.py. With MLW_STORAGE_URL empty the storage features are off.
      MLW_STORAGE_URL: ${MLW_STORAGE_URL:-}
      MLW_STORAGE_SFTP_HOST: ${MLW_STORAGE_SFTP_HOST:-}
      MLW_STORAGE_SFTP_PORT: ${MLW_STORAGE_SFTP_PORT:-2222}
      MLW_STORAGE_NAME: ${MLW_STORAGE_NAME:-mlw-storage}
      MLW_STORAGE_REQUIRED_ROLE: ${MLW_STORAGE_REQUIRED_ROLE:-mlw-user}
      MLW_STORAGE_READONLY_ROLE: ${MLW_STORAGE_READONLY_ROLE:-}
      MLW_STORAGE_HOST_KEY: ${MLW_STORAGE_HOST_KEY:-}
      MLW_STORAGE_TIMEOUT: ${MLW_STORAGE_TIMEOUT:-8}
      # Each logged-in user's saved settings and unsaved drafts live in Valkey (see
      # userstore.py). With MLW_VALKEY_URL empty the app falls back to per-browser
      # storage in NICEGUI_STORAGE_PATH.
      MLW_VALKEY_URL: ${MLW_VALKEY_URL-valkey://valkey:6379/0}
      MLW_VALKEY_PASSWORD: ${MLW_VALKEY_PASSWORD:-}
      MLW_VALKEY_PREFIX: ${MLW_VALKEY_PREFIX:-mlw:xsheet}
    depends_on:
      valkey:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro

  # The per-user store: preferences, recent files and unsaved drafts, one record
  # per logged-in user (see userstore.py for the key layout). Not published on
  # the host (the dev override publishes it on localhost only). Persistent: every
  # write is appended to the valkey-data volume (append-only file).
  valkey:
    image: valkey/valkey:8-alpine
    command: ["sh", "-c", "exec valkey-server --appendonly yes --save 300 1 ${MLW_VALKEY_PASSWORD:+--requirepass \"$$MLW_VALKEY_PASSWORD\"}"]
    environment:
      MLW_VALKEY_PASSWORD: ${MLW_VALKEY_PASSWORD:-}
    volumes:
      - valkey-data:/data
    healthcheck:
      # (valkey-cli reads the password from REDISCLI_AUTH)
      test: ["CMD-SHELL", "[ -z \"$$MLW_VALKEY_PASSWORD\" ] || export REDISCLI_AUTH=\"$$MLW_VALKEY_PASSWORD\"; valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  valkey-data:

version: "3.9"

services:
  nicegui:
    build: .
    container_name: nicegui_dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - ./requirements.txt:/app/requirements.txt
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    command: uvicorn main:app --host 0.0.0.0 --port 8080 --reload

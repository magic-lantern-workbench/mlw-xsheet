# Development overrides, merged automatically by `docker compose up`.
# Mounts the working tree so edits are picked up by NiceGUI's auto-reload,
# and re-installs requirements.txt on each start (see docker-entrypoint.sh).
services:
  xsheet:
    image: mlw-xsheet:dev
    container_name: nicegui_dev
    build:
      target: dev
    volumes:
      - .:/app
    environment:
      MLW_RELOAD: "1"
    # Also join the platform stack's network, so the app can reach its Keycloak
    # server (mlw-keycloak:8080; see MLW_KEYCLOAK_URL in .env).
    networks:
      - default
      - mlw-platform

  # Publish Redis on this machine only, so its records can be inspected while
  # developing (e.g. redis-cli -p 6380 --scan --pattern 'mlw:xsheet:*').
  redis:
    ports:
      - "127.0.0.1:${MLW_REDIS_HOST_PORT:-6380}:6379"

networks:
  mlw-platform:
    name: mlw-platform_default
    external: true
